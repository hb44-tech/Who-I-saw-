<!DOCTYPE html><html>
<head>
    <title>System Warning</title>
</head>
<style>
    body {
        background-color: black;
        color: red;
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 100px;
    }

    h1 {
        color: red;
        font-size: 32px;
    }
    .scan-box {
width: 50%;
max-width: 210px;
height: 12px;
border: 2px solid red;
margin: 20px auto;
overflow: hidden;
} 
.scan-bar {
    width: 0%;
    height: 100%;
    background: red;
    animation: loadScan 2s linear forwards;
}

@keyframes loadScan {
    from {
        width: 0%;
    }
    to {
        width: 100%;
    }
}
.warning {
animation: flash 1s infinite;
}

@keyframes flash {
    0%, 100% { opacity: 1; }
    40% { opacity: 0.3; }
}
.scan-box {
width: 80%;
max-width: 350px;
height: 22px;
border: 2px solid red;
margin: 30px auto;
overflow: hidden;
}

.scan-bar {
    height: 100%;
    width: 0%;
    background: red;
    animation: scanning 5s linear infinite;
}

@keyframes scanning {
    from { width: 0%; }
    to { width: 100%; }
}
</style>
<body><h1 class="warning">⚠ SYSTEM WARNING ⚠</h1> 

<h2>SECURITY BREACH DETECTED YOUR PHONE HAS BEEN INFECTED WITH A Virus </h2>

<p>Your device has entered emergency mode and will shut down in 4s.</p>

<p style="color: white;">
    Initializing security scan...<div class="scan-box">
    <div class="scan-bar"></div>
</div>
<p>SIMULATED SCAN IN PROGRESS...</p>
</p>

<p style="color: red;">
    STATUS: SIMULATION
</p>
<h2 id="countdown" style="color: red;">SYSTEM LOCK IN: 10</h2><script>
    let timeLeft = 4;

    const timer = setInterval(function() {
        timeLeft--;

        if (timeLeft > 0) {
            document.getElementById("countdown").textContent =
                "SYSTEM LOCK IN: " + timeLeft;
        } else {
            clearInterval(timer);
            document.getElementById("countdown").textContent =
                "JUST KIDDING! 😂 YOU GOT PRANKED by Hb!";
            document.getElementById("countdown").style.color = "lime";
        }
    }, 1000);
</script>
</body>
</html>
